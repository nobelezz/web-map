<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Public Web Map</title>

  <!-- ArcGIS Maps SDK CSS & JS -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.30/"></script>

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>

  <script>
    require([
      "esri/WebMap",
      "esri/views/MapView",
      "esri/widgets/Legend",
      "esri/widgets/Home"
    ], function(WebMap, MapView, Legend, Home) {

      // Replace this with your ArcGIS Online Web Map ID
      const webmap = new WebMap({
        portalItem: {
          id: 8484f6ee0b4540da9a6d8fb6652820a6
        }
      });

      const view = new MapView({
        container: "viewDiv",
        map: webmap
      });

      // Add default map widgets
      view.ui.add(new Home({ view: view }), "top-left");
      view.ui.add(new Legend({ view: view }), "bottom-right");
    });
  </script>
</head>
<body>
  <div id="viewDiv"></div>
</body>
</html>
